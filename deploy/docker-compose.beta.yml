name: giproy-beta

services:
  postgres:
    image: postgres:18
    container_name: giproy-beta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - giproy_beta_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    image: giproy-beta-backend:${GIPROY_IMAGE_TAG:-local}
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      API_V1_STR: ${API_V1_STR}
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      CREATE_TABLES_ON_STARTUP: "false"
      BIM_ENABLED: "false"
      BIM_ALLOWED_EMPRESA_IDS: ${BIM_ALLOWED_EMPRESA_IDS:-}
      BIM_ALLOWED_USER_IDS: ${BIM_ALLOWED_USER_IDS:-}
      REPORTS_DIR: /app/reports
      AUTH_SESSION_TRACE_FILE: /app/logs/auth_session_trace.jsonl
      EMAIL_BACKEND: ${EMAIL_BACKEND:-mock}
      EMAIL_FROM_EMAIL: ${EMAIL_FROM_EMAIL:-soporte@giproy.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-GiProy}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    command: ["alembic", "-c", "alembic.ini", "upgrade", "heads"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - giproy_beta_uploads:/app/backend/uploads
      - giproy_beta_logs:/app/logs
    networks:
      - backend
    profiles:
      - tools

  bootstrap:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    image: giproy-beta-backend:${GIPROY_IMAGE_TAG:-local}
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      API_V1_STR: ${API_V1_STR}
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      CREATE_TABLES_ON_STARTUP: "false"
      BIM_ENABLED: "false"
      BIM_ALLOWED_EMPRESA_IDS: ${BIM_ALLOWED_EMPRESA_IDS:-}
      BIM_ALLOWED_USER_IDS: ${BIM_ALLOWED_USER_IDS:-}
      REPORTS_DIR: /app/reports
      AUTH_SESSION_TRACE_FILE: /app/logs/auth_session_trace.jsonl
      EMAIL_BACKEND: ${EMAIL_BACKEND:-mock}
      EMAIL_FROM_EMAIL: ${EMAIL_FROM_EMAIL:-soporte@giproy.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-GiProy}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    command: ["sh", "-c", "python scripts/docker_bootstrap_schema.py && alembic -c alembic.ini stamp heads"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - giproy_beta_uploads:/app/backend/uploads
      - giproy_beta_logs:/app/logs
    networks:
      - backend
    profiles:
      - tools

  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    image: giproy-beta-backend:${GIPROY_IMAGE_TAG:-local}
    container_name: giproy-beta-backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      API_V1_STR: ${API_V1_STR}
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      CREATE_TABLES_ON_STARTUP: "false"
      BIM_ENABLED: "false"
      BIM_ALLOWED_EMPRESA_IDS: ${BIM_ALLOWED_EMPRESA_IDS:-}
      BIM_ALLOWED_USER_IDS: ${BIM_ALLOWED_USER_IDS:-}
      REPORTS_DIR: /app/reports
      AUTH_SESSION_TRACE_FILE: /app/logs/auth_session_trace.jsonl
      EMAIL_BACKEND: ${EMAIL_BACKEND:-mock}
      EMAIL_FROM_EMAIL: ${EMAIL_FROM_EMAIL:-soporte@giproy.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-GiProy}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      RUC_REVIEW_ENCRYPTION_KEY: ${RUC_REVIEW_ENCRYPTION_KEY}
      SRI_RUC_PRIVATE_DIR: /app/backend/runtime/sri_ruc
      SRI_RUC_ALERT_EMAIL: ${SRI_RUC_ALERT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - giproy_beta_uploads:/app/backend/uploads
      - giproy_beta_logs:/app/logs
      - giproy_beta_sri_ruc:/app/backend/runtime/sri_ruc
    networks:
      - backend

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      args:
        VITE_ADAPTIVE_UI_ENABLED: ${VITE_ADAPTIVE_UI_ENABLED:-false}
        VITE_ADAPTIVE_UI_MODULES: ${VITE_ADAPTIVE_UI_MODULES:-}
    image: giproy-beta-frontend:${GIPROY_IMAGE_TAG:-local}
    container_name: giproy-beta-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    # El frontend queda aislado de Traefik y solo acepta tráfico desde el WAF
    # por la red backend.
    networks:
      - backend

  waf:
    # Reverse proxy WAF aislado. CRS permanece en detección hasta completar la
    # ventana de observación y las exclusiones focales de falsos positivos.
    image: owasp/modsecurity-crs:4.25-nginx-lts@sha256:dc68fb3684bd5e68d0b59a4b27a4b41847c16815e0bd4f9dac4c74b8d5c4028b
    container_name: giproy-beta-waf
    restart: unless-stopped
    environment:
      BACKEND: http://giproy-beta-frontend:80
      SERVER_NAME: ${GIPROY_HOST}
      PORT: "8080"
      MODSEC_RULE_ENGINE: DetectionOnly
      MODSEC_TAG: giproy-beta-waf
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      # Evita persistir cuerpos, credenciales y PII en el audit log.
      MODSEC_AUDIT_LOG_PARTS: "AHZ"
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      # GiProy maneja JSON operativos extensos e IFC reales > 13 MiB.
      MODSEC_REQ_BODY_LIMIT: "134217728"
      MODSEC_REQ_BODY_NOFILES_LIMIT: "16777216"
      MODSEC_REQ_BODY_LIMIT_ACTION: Reject
      MAX_FILE_SIZE: "134217728"
      COMBINED_FILE_SIZES: "134217728"
      # No inspeccionar respuestas grandes/artefactos BIM; el WAF protege la
      # entrada y evita retener datos de respuesta en memoria.
      MODSEC_RESP_BODY_ACCESS: "Off"
      # Traefik es el único peer permitido y Cloudflare entrega la IP original.
      REAL_IP_HEADER: CF-Connecting-IP
      SET_REAL_IP_FROM: 172.18.0.0/16
      NGINX_X_FORWARDED_PROTO: https
      NGINX_X_FORWARDED_PORT: "443"
      NGINX_WORKER_PROCESSES: "2"
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./waf/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./waf/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
    networks:
      - backend
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.giproy-beta.rule=Host(`${GIPROY_HOST}`)
      - traefik.http.routers.giproy-beta.entrypoints=web
      - traefik.http.services.giproy-beta.loadbalancer.server.port=8080
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 64

volumes:
  giproy_beta_postgres_data:
  giproy_beta_uploads:
  giproy_beta_logs:
  giproy_beta_sri_ruc:

networks:
  proxy:
    external: true
  backend:
    external: true
